name: cue
description: CUE (C-U-E), an earphone-triggered habit transcription journal.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audio_session: ^0.2.3
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  flutter_foreground_task: ^9.2.2
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^3.3.1
  geolocator: ^14.0.2
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  record: ^6.2.0
  shared_preferences: ^2.5.5
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
